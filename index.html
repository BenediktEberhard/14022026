<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Für Meinen Lieblingsmenschen ❤️</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(to bottom, #050816, #0d1b3d);
    font-family: Arial, sans-serif;
    color: white;
}

#intro {
    text-align: center;
    padding: 30px;
    font-size: 1.2rem;
}

.star {
    position: absolute;
    font-size: 35px;
    cursor: pointer;
    color: #888;
    transition: all 0.4s;
    user-select: none;
}

.star.found {
    color: gold;
    text-shadow: 0 0 15px gold;
    transform: scale(1.3);
}

#messageBox {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 85%;
    max-width: 500px;
    background: rgba(0,0,0,0.8);
    padding: 15px;
    border-radius: 15px;
    text-align: center;
    display: none;
}

#finalMessage {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
    font-size: 1.5rem;
    line-height: 1.6;
}

.twinkle {
    position: absolute;
    color: white;
    opacity: 0.3;
    animation: twinkle 3s infinite;
}

@keyframes twinkle {
    50% {
        opacity: 1;
    }
}
</style>
</head>
<body>

<div id="intro">
    ✨<br><br>
    Ein paar Sterne für einen Menschen,<br>
    der manchmal vergisst, wie besonders er ist. ❤️
</div>

<div id="messageBox"></div>

<div id="finalMessage">
    <div>
        ❤️<br><br>
        Du hast alle Sterne gefunden.<br><br>
        Aber meinen Lieblingsstern finde ich jeden Tag wieder:<br><br>
        <strong>Dich. ❤️</strong>
    </div>
</div>

<script>
const messages = [
    "Ich bin stolz auf dich.❤️",
    "Du schaffst mehr, als du dir selbst zutraust.❤️",
    "Ich liebe dich über alles und für den Menschen, der du bist. ❤️",
    "Du musst nicht alles allein tragen.❤️",
    "Und egal was passiert: Ich bin da.❤️"
];

const positions = [
    [20,20],
    [75,25],
    [35,45],
    [70,65],
    [15,75]
];

let found = 0;

positions.forEach((pos, index) => {
    const star = document.createElement("div");
    star.className = "star";
    star.innerHTML = "★";
    star.style.left = pos[0] + "%";
    star.style.top = pos[1] + "%";

    star.addEventListener("click", () => {
        if (star.classList.contains("found")) return;

        star.classList.add("found");

        const box = document.getElementById("messageBox");
        box.innerHTML = messages[index];
        box.style.display = "block";

        found++;

        if(found === messages.length){
            setTimeout(() => {
                document.getElementById("finalMessage").style.display = "flex";
            }, 1500);
        }
    });

    document.body.appendChild(star);
});

// Hintergrundsterne
for(let i = 0; i < 80; i++){
    const s = document.createElement("div");
    s.className = "twinkle";
    s.innerHTML = "•";
    s.style.left = Math.random()*100 + "%";
    s.style.top = Math.random()*100 + "%";
    s.style.animationDelay = Math.random()*3 + "s";
    document.body.appendChild(s);
}
</script>

</body>
</html>
